
<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Pottery Class Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
{
    box-sizing: border-box;
}

body {
    background: whitesmoke;
    margin: 8px;
    font-family: "Google Sans", sans-serif;
    color: #171411;
}
#page {
    width: 928px;
    height: auto;
    background: #f7f5f2;
    margin: 0 auto;
    padding: 0;
    border: 1px solid darkgray;
    box-shadow: 2px 3px 6px darkgray;
}
#Banner-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    object-position: 0% 72%;
    display: block;
}
h1 {
    font: 40pt/1.1em "Permanent Marker", cursive;
    text-align: center;
    font-weight: 200;
    display: inline-block;
    background-color: #3F3027;
    color: #f7f5f2;
    border: 20px solid #3F3027;
    border-top-right-radius: 50px;
    border-bottom-right-radius: 50px;
    margin: 10px auto;
}
h2 {
    font: 18pt/1.2em "Google Sans", sans-serif;
    text-align: center;
    font-weight: 700;
    color: #171411;
    margin: 15px auto;
}
.intro {
    width: 824px;
    margin: 15px auto 30px;
    text-align: center;
    font-size: 14pt;
    line-height: 1.5;
}
.form-container {
    width: 824px;
    margin: 20px auto 40px;
    padding: 35px;
    background: #e8ded2;
    border-radius: 12px;
}
label {
    display: block;
    font-size: 12pt;
    font-weight: 700;
    margin-bottom: 8px;
    color: #3F3027;
}
input[type="text"],
input[type="email"],
select,
textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 22px;
    border: 1px solid #AD987A;
    border-radius: 5px;
    background: #f7f5f2;
    font-family: "Google Sans", sans-serif;
    font-size: 12pt;
    color: #171411;
}
textarea {
    min-height: 130px;
    resize: vertical;
}
.name-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}
fieldset {
    border: 1px solid #AD987A;
    border-radius: 6px;
    padding: 18px;
    margin: 0 0 25px;
}

legend {
    font-family: "Permanent Marker", cursive;
    font-size: 18pt;
    color: #3F3027;
    padding: 0 10px;
}
.option {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
    font-weight: 400;
    cursor: pointer;
}

.option input {
    accent-color: #3F3027;
    width: 18px;
    height: 18px;
}
.button-group {
    display: flex;
	justify-content: center;
	align-content: center;
    gap: 15px;
    margin-top: 10px;
}

button {
    padding: 14px 30px;
    border: none;
    border-radius: 6px;
    font-family: "Google Sans", sans-serif;
    font-weight: 700;
    font-size: 13pt;
    cursor: pointer;
}

.submit-button {
    background: #3F3027;
    color: #f7f5f2;
}

button:hover {
    opacity: 0.85;
}

</style>
</head>

<body>

<div id="page">
<img id="Banner-img"
         src="pexels-lam-thanh-1100392445-28867401.jpg"
         alt="Pottery banner">


    <h1>Registration</h1>

    <h2>Getting Started With Clay</h2>

    <p class="intro">
        Interested in learning pottery?
        Lets get started today!
    </p>

    <div class="form-container">

        <form id="pottery-form">

            <!-- NAME -->

            <div class="name-grid">

                <div>
                    <label for="first-name">
                        First Name
                    </label>

                    <input type="text"
                           id="first-name"
                           name="first_name"
                           placeholder="First Name"
                           required>
                </div>

                <div>
                    <label for="last-name">
                        Last Name
                    </label>

                    <input type="text"
                           id="last-name"
                           name="last_name"
                           placeholder="Last Name"
                           required>
                </div>

            </div>


            <label for="email">
                Email Address
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="example@email.com"
                   required>


            <fieldset>

                <legend>
                    What Interests You?
                </legend>

                <label class="option">
                    <input type="radio"
                           name="pottery_interest"
                           value="wheel_throwing"
                           required>
                    Wheel Throwing
                </label>

                <label class="option">
                    <input type="radio"
                           name="pottery_interest"
                           value="hand_building">
                    Hand Building
                </label>

                <label class="option">
                    <input type="radio"
                           name="pottery_interest"
                           value="both">
                    Both
                </label>

            </fieldset>

            <label for="experience">
                Experience Level
            </label>

            <select id="experience"
                    name="experience"
                    required>

                <option value="">
                    Select Your Experience
                </option>

                <option value="beginner">
                    Beginner
                </option>

                <option value="intermediate">
                    Intermediate
                </option>

                <option value="advanced">
                    Advanced
                </option>

            </select>

            <fieldset>

                <legend>
                    What Would You Like to Learn?
                </legend>

                <label class="option">
                    <input type="checkbox"
                           name="class_options"
                           value="bowls">
                    Making Bowls
                </label>

                <label class="option">
                    <input type="checkbox"
                           name="class_options"
                           value="mugs">
                    Making Mugs
                </label>

                <label class="option">
                    <input type="checkbox"
                           name="class_options"
                           value="sculpture">
                    Sculpting with Clay
                </label>

                <label class="option">
                    <input type="checkbox"
                           name="class_options"
                           value="glazing">
                    Glazing and Decorating
                </label>

            </fieldset>

            <label for="message">
                Questions or Comments
            </label>

            <textarea id="message"
                      name="message"
                      placeholder="Tell us what you would like to learn..."></textarea>
			
            <div class="button-group">

                <button type="submit"
                        class="submit-button">
                    Submit Registration
                </button>

            </div>

        </form>

    </div>


   
</div>

</body>
</html>
